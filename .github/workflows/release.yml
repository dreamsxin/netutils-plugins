name: Release

on:
  # 正常路径：推 v* 标签发布
  push:
    tags: ['v*']
  # 补救路径：标签已存在但当时仓库里还没有本 workflow 时手动触发。
  # tag 触发使用的是**标签所指提交**里的 workflow 文件，
  # 因此新加的 workflow 对已有标签不生效。
  workflow_dispatch:

# SDK 与 5 个插件同版本齐步发布，顺序是硬约束：
# 插件都声明 netutils-plugin-sdk = "0.2"，SDK 未进索引前插件无法解析依赖。
jobs:
  sdk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain

      # 版本号以 Cargo.toml 为唯一来源，并要求 workspace 内所有 crate 一致；
      # 由标签触发时再断言标签与之相符。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          versions="$(cargo metadata --no-deps --format-version 1 \
                      | jq -r '.packages[] | "\(.name) \(.version)"')"
          version="$(echo "$versions" | awk '{print $2}' | sort -u)"
          if [ "$(echo "$version" | wc -l)" -ne 1 ]; then
            echo "crate versions are not aligned:" >&2
            echo "$versions" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag_version" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match crate version ${version}" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publishing version ${version}"

      # 重跑阻塞门：标签可能指向一个从未通过 CI 的提交
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # 判断是否已发布走 sparse index 而不是 `cargo info`：在 workspace 内
      # `cargo info` 会优先匹配**本地**包，对未发布的版本同样返回 0，
      # 会导致永远跳过发布。
      - name: Publish netutils-plugin-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crate=netutils-plugin-sdk
          version="${{ steps.version.outputs.version }}"
          index_url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
          if curl -sf "$index_url" | grep -q "\"vers\":\"${version}\""; then
            echo "${crate} ${version} is already on crates.io, skipping"
            exit 0
          fi
          cargo publish -p "$crate"

  plugins:
    needs: sdk
    runs-on: ubuntu-latest
    strategy:
      # 串行发布：并发只会同时冲击索引，收益为零
      max-parallel: 1
      fail-fast: false
      matrix:
        crate: [chrome-proxy, mcp, sse, subdomain, ws]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain

      # 发布成功不等于索引立即可见，插件解析 SDK 依赖会失败
      - name: Wait for the SDK to appear in the index
        run: |
          set -euo pipefail
          crate=netutils-plugin-sdk
          version="${{ needs.sdk.outputs.version }}"
          index_url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
          for attempt in $(seq 1 30); do
            if curl -sf "$index_url" | grep -q "\"vers\":\"${version}\""; then
              echo "${crate} ${version} is visible in the index"
              exit 0
            fi
            echo "waiting for ${crate} ${version} (${attempt}/30)"
            sleep 10
          done
          echo "${crate} ${version} did not appear in the index in time" >&2
          exit 1

      - name: Publish netutils-plugin-${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crate="netutils-plugin-${{ matrix.crate }}"
          version="${{ needs.sdk.outputs.version }}"
          index_url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
          if curl -sf "$index_url" | grep -q "\"vers\":\"${version}\""; then
            echo "${crate} ${version} is already on crates.io, skipping"
            exit 0
          fi
          cargo publish -p "$crate"
